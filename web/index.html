<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Séries</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>Séries</h1>
          <p>Brazilian securitization series</p>
        </div>
      </div>
      <div class="topbar-aside">
        <nav class="site-nav" aria-label="Catalog sections">
          <a class="active" href="/">Séries</a>
          <a href="/documentos">Documentos</a>
        </nav>
        <p class="count" id="result-count">Loading…</p>
      </div>
    </header>

    <main>
      <form class="filters filters-emissoes" id="filters" autocomplete="off">
        <label>
          <span>Company</span>
          <input id="filter-company" name="company" list="company-options" placeholder="All companies" />
          <datalist id="company-options"></datalist>
        </label>
        <label>
          <span>CETIP</span>
          <input id="filter-cetip" name="cetip" placeholder="Any CETIP" />
        </label>
        <label>
          <span>ISIN</span>
          <input id="filter-isin" name="isin" placeholder="Any ISIN" />
        </label>
        <label>
          <span>Securitization company</span>
          <select id="filter-fonte" name="fonte">
            <option value="">All</option>
          </select>
        </label>
        <div class="filter-actions">
          <button type="submit">Filter</button>
          <button type="button" class="ghost" id="reset-filters">Clear</button>
        </div>
      </form>

      <section class="list-card" aria-live="polite">
        <div class="list-head list-head-emissoes">
          <span>Company</span>
          <span>Fonte</span>
          <span>ISIN</span>
          <span>CETIP</span>
          <span>Issue date</span>
          <span>Maturity</span>
        </div>
        <ul class="list" id="serie-list"></ul>
        <p class="status" id="status" hidden></p>
        <button type="button" class="load-more" id="load-more" hidden>Load more</button>
      </section>
    </main>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-backdrop" data-close="true"></div>
      <aside class="sheet-panel sheet-panel-wide" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <header>
          <h2 id="sheet-title">Série</h2>
          <button type="button" class="icon-close" data-close="true" aria-label="Close">×</button>
        </header>
        <div class="sheet-body" id="sheet-body"></div>
      </aside>
    </div>

    <script src="app.js"></script>
  </body>
</html>

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "br-securitization-scrapers"
version = "0.1.0"
description = "Daily incremental scrapers for Brazilian securitization websites into RDS PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.44",
]
dev = [
    "playwright>=1.44",
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["shared"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
